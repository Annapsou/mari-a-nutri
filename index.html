            "@type": "Answer",
            "text": "O investimento pode variar de acordo com o formato de acompanhamento escolhido (consulta avulsa ou Programa Emagrecimento Real de 8 semanas). Para consultar valores e opções, fale diretamente com a Clínica Maria Nutri pelo WhatsApp."

          "@type": "Question",
          "name": "Preciso cortar carboidratos para emagrecer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não necessariamente. A proposta da Clínica Maria Nutri é evitar restrições extremas e construir uma alimentação equilibrada e saborosa que faça sentido para o seu dia a dia."
          }
        },
        {
          "@type": "Question",
          "name": "O plano alimentar é personalizado para a minha rotina?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, 100% individualizado. Consideramos seus horários, preferências, rotina de trabalho e metas pessoais para que seja prático e sustentável."
          }
        },
        {
          "@type": "Question",
          "name": "Posso continuar comendo alimentos como cuscuz e tapioca?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Com certeza! A proposta da Clínica Maria Nutri é valorizar a cultura alimentar nordestina e a vida real, ajustando as porções e combinações estratégicas para o seu emagrecimento."
          }
        },
        {
          "@type": "Question",
          "name": "Onde fica a Clínica Maria Nutri em Natal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A clínica fica na Avenida Hermes da Fonseca, 1200, Edifício Tirol Corporate, Sala 405, no bairro Tirol, em Natal - RN."
          }
        },
        {
          "@type": "Question",
          "name": "Qual é o horário de atendimento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O atendimento acontece de segunda a sexta-feira, das 08h00 às 19h00, e aos sábados, das 08h00 às 12h00, sempre com hora marcada."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona a bioimpedância InBody?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A bioimpedância InBody é utilizada para analisar minuciosamente a composição corporal, incluindo informações como massa gorda, massa muscular, retenção de líquidos e taxa metabólica basal."
          }
        },
        {
          "@type": "Question",
          "name": "Como faço para agendar minha consulta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O agendamento é feito de forma rápida e prática diretamente pelo WhatsApp oficial. Basta clicar no botão de contato para falar com a equipe."
          }
        },
        {
          "@type": "Question",
          "name": "Quais são as formas de pagamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aceitamos Pix, cartões de crédito e débito, além de condições especiais para programas de acompanhamento contínuo."
          }
        },
        {
          "@type": "Question",
          "name": "O que diferencia a Clínica Maria Nutri?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A clínica une acompanhamento individualizado, método de emagrecimento sem dietas extremas, suporte direto pelo WhatsApp, aplicativo próprio com plano alimentar e receitas, e avaliação da composição corporal InBody, em um consultório moderno e acolhedor."
          }
        }
      ]
    }
